name: Release

# A version tag (v1.2.3) on a commit that passed CI publishes:
#   * the container image to GitHub Container Registry - scanned before anything is pushed (a
#     fixable HIGH/CRITICAL vulnerability stops the release), pushed with SBOM and SLSA provenance
#     attestations, signed keyless with Sigstore cosign (this workflow's OIDC identity) and
#     attested with GitHub build provenance;
#   * the wheel and the source distribution, each signed with cosign (.sigstore.json) and covered
#     by SLSA build provenance (.intoto.jsonl), attached to a GitHub release together with the
#     image's CycloneDX SBOM.
# Verify before deploying: SECURITY.md, "Operating it securely".

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write  # push to ghcr.io
      id-token: write  # keyless signing and provenance (OIDC)
      attestations: write  # GitHub artifact attestations
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (registries want lower case)
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Tags (version, major.minor, commit)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=AegisSupport AI
            org.opencontainers.image.description=Secure LLM-powered customer support platform
            org.opencontainers.image.licenses=MIT
      - name: Build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: aegis-support:candidate
      - name: Trivy - stop on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: aegis-support:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (SBOM and provenance attestations attached)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Signing and GitHub attestations run from a public repository only: Sigstore's
      # transparency log is public, and attestations for private repositories need GitHub
      # Enterprise Cloud.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: ${{ !github.event.repository.private }}
      - name: Sign the image (keyless, by digest)
        if: ${{ !github.event.repository.private }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: GitHub build provenance for the image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM (CycloneDX) of the published image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: aegis-support-image.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-sbom
          path: aegis-support-image.cdx.json
          retention-days: 90

  release:
    name: Distributions and GitHub release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # create the GitHub release
      id-token: write  # build provenance (OIDC)
      attestations: write  # GitHub artifact attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: false
      - name: Version tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(uv version --short)" = "${TAG}"
      - name: Build the wheel and the source distribution
        run: uv build --no-sources
      - name: Build provenance for the distributions
        id: provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          # Explicit patterns: `uv build` also writes dist/.gitignore, which is not a release artifact.
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: ${{ !github.event.repository.private }}
      - name: Sign the distributions (keyless) and attach the provenance
        if: ${{ !github.event.repository.private }}
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done
          # The SLSA provenance (an in-toto statement in a Sigstore bundle) as a release asset.
          jq -c . "${BUNDLE}" > dist/aegis_support.intoto.jsonl
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: image-sbom
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${TAG#v}"
          {
            awk -v v="${version}" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md
            echo
            echo "### Container image"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\` - signed with Sigstore cosign, with SLSA provenance and an SBOM;"
            echo "see SECURITY.md (\"Operating it securely\") to verify it before deploying."
          } > release-notes.md
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "AegisSupport AI ${version}" \
            --notes-file release-notes.md --verify-tag \
            dist/* aegis-support-image.cdx.json
