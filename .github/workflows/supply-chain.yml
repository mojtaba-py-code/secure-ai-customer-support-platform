name: Supply chain

# * Dependency review blocks a pull request that adds a dependency with a known vulnerability
#   (moderate or worse) or a copyleft licence the MIT-licensed project cannot ship.
# * OpenSSF Scorecard grades the repository's supply-chain practices on every push to main and
#   every week, and publishes the score.
# * Every week, Trivy scans the third-party images the Compose stack runs (PostgreSQL, Redis,
#   Qdrant) exactly as pinned. The findings go to code scanning; the fix for a fixable one is a
#   newer pin, which Dependabot proposes.
#
# Dependency review and Scorecard need a public repository; on a private one they are skipped.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload the results to code scanning
      id-token: write  # publish the results to the OpenSSF API (signed with OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  third-party-images:
    name: Trivy (${{ matrix.service }})
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - {service: postgres, repository: "postgres:"}
          - {service: redis, repository: "redis:"}
          - {service: qdrant, repository: "qdrant/qdrant:"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Image reference, exactly as pinned in docker-compose.yml
        id: image
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          image="$(grep -E "^[[:space:]]+image: ${REPOSITORY}" docker-compose.yml | head -n 1 | awk '{print $2}')"
          test -n "${image}"
          echo "ref=${image}" >> "$GITHUB_OUTPUT"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}
